var theme=document.documentElement.dataset.theme;
var filter=0;
var main=document.getElementById('main'),q=document.getElementById('q');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d')}
function render(){
  var term=norm(q.value.trim()),n=0,html='';
  for(var p=1;p<=8;p++){
    if(filter&&filter!==p)continue;
    var items=DATA.filter(function(m){return m.p===p&&(!term||norm(m.c+' '+m.n+' '+m.d).indexOf(term)>=0)});
    if(!items.length)continue;n+=items.length;
    html+='<section><h2>Giai đoạn '+p+' — '+esc(PH[p])+' <span>'+items.length+' trang</span></h2><div class="grid">';
    items.forEach(function(m){
      var img='screenshots/'+m.b+'.'+theme+'.png';
      html+='<article class="card"><a class="thumb" href="'+img+'" aria-label="Mở ảnh '+esc(m.c)+' '+theme+'"><img loading="lazy" src="'+img+'" alt="'+esc(m.c+' '+m.n+' ('+theme+')')+'"></a>'
      +'<div class="meta"><span class="code">'+esc(m.c)+(m.s?' · '+m.s+' state':'')+'</span><span class="name">'+esc(m.n)+'</span><span class="desc">'+esc(m.d)+'</span></div>'
      +'<div class="links"><a href="screenshots/'+m.b+'.light.png">Ảnh Light</a><a href="screenshots/'+m.b+'.dark.png">Ảnh Dark</a><a href="screens/'+m.b+'.html?theme='+theme+'">HTML</a></div></article>';
    });
    html+='</div></section>';
  }
  main.innerHTML=html||'<p class="empty">Không có màn nào khớp.</p>';
  document.getElementById('count').textContent=n+' / '+DATA.length+' trang mockup · '+theme.charAt(0).toUpperCase()+theme.slice(1);
}
function setTheme(t){theme=t;document.documentElement.dataset.theme=t;try{localStorage.setItem('tbc-gallery-theme',t)}catch(e){}
  document.getElementById('bL').setAttribute('aria-pressed',t==='light');document.getElementById('bD').setAttribute('aria-pressed',t==='dark');render()}
document.getElementById('bL').onclick=function(){setTheme('light')};
document.getElementById('bD').onclick=function(){setTheme('dark')};
